{{- if gt (len .Fragments.Headings) 0 -}}
<details class="toc">
  <summary accesskey="c" title="展开或收起目录 (Alt + C)"><span class="title">文章目录</span></summary>
  <div class="inner">{{ .TableOfContents }}</div>
</details>
<script>
(() => {
  const toc = document.querySelector('.reading-toc .toc');
  if (!toc) return;
  const desktop = window.matchMedia('(min-width: 1001px)');
  const syncLayout = () => { toc.open = desktop.matches; };
  syncLayout();
  desktop.addEventListener('change', syncLayout);
})();
</script>
{{- end -}}
